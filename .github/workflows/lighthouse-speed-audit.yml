name: Lighthouse speed audit

on:
  push:
    branches:
      - audit/lighthouse-speed

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://panachaikotrails-git-perf-l-d40a12-gianeleftheri-8019s-projects.vercel.app/
          uploadArtifacts: true
          temporaryPublicStorage: true
