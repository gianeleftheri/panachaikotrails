name: Package Admin UI 0.7.12

on:
  push:
    branches:
      - package-admin-ui-0.7.12-artifact

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          cd wordpress
          zip -r ../panachaiko-trails-admin-ui-0.7.12.zip panachaiko-trails-admin-ui
      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: panachaiko-trails-admin-ui-0.7.12
          path: panachaiko-trails-admin-ui-0.7.12.zip
          if-no-files-found: error
