<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panachaiko Trails — Έλεγχος σημείων αναψυχής και θέας</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    html,body,#map{height:100%;margin:0}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07100b;color:#fff}
    #map{position:absolute;inset:0}
    .panel{position:absolute;z-index:5;top:16px;left:16px;width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:rgba(7,16,11,.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 16px 44px rgba(0,0,0,.35)}
    .panel h1{font-size:18px;line-height:1.25;margin:0;padding:16px 16px 6px}
    .panel .sub{font-size:12px;color:#cbd5e1;padding:0 16px 12px}
    .point-list{display:grid;gap:8px;padding:0 12px 14px}
    .point{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer;border:1px solid transparent}
    .point:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1)}
    .num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ff6b35;color:#fff;font-weight:800}
    .point b{display:block;font-size:13px;line-height:1.3}
    .point small{display:block;margin-top:3px;color:#aebbc5;font-size:11px}
    .legend{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#d4dde5}
    .legend-row{display:flex;align-items:center;gap:8px;margin:6px 0}
    .line-sample{width:28px;height:4px;border-radius:999px;background:linear-gradient(90deg,#06b6d4,#f59e0b,#22c55e,#e879f9)}
    .marker{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff6b35;border:3px solid #fff;box-shadow:0 3px 12px rgba(0,0,0,.45);display:grid;place-items:center}
    .marker span{transform:rotate(45deg);font-weight:900;font-size:12px;color:#fff}
    .maplibregl-popup-content{color:#111827;border-radius:12px;padding:12px 14px;max-width:280px}
    .maplibregl-popup-content b{font-size:13px}
    .maplibregl-popup-content small{display:block;margin-top:4px;color:#4b5563}
    .status{padding:10px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#93c5fd}
    @media (max-width:700px){.panel{top:10px;left:10px;width:calc(100vw - 20px);max-height:42vh}.maplibregl-ctrl-top-right{top:43vh}}
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="panel">
    <h1>Σημεία αναψυχής / θέας — χωρικός έλεγχος</h1>
    <div class="sub">Οι υπάρχουσες διαδρομές του Panachaiko Trails εμφανίζονται μαζί με τα 6 σημεία. Πατήστε σημείο ή διαδρομή για λεπτομέρειες.</div>
    <div class="point-list" id="pointList"></div>
    <div class="legend">
      <div class="legend-row"><span class="num" style="width:22px;height:22px;font-size:10px">1</span> Σημεία ελέγχου</div>
      <div class="legend-row"><span class="line-sample"></span> Υφιστάμενες διαδρομές</div>
    </div>
    <div class="status" id="status">Φόρτωση διαδρομών…</div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const points = [
      {n:1,name:'ΤΡΑΝΟΣ ΒΡΑΧΟΣ',lat:38.201704,lng:21.799969},
      {n:2,name:'ΑΓΙΟΣ ΙΩΑΝΝΗΣ – ΚΟΚΚΙΝΟΒΡΥΣΗ',lat:38.230763,lng:21.831333},
      {n:3,name:'ΘΕΣΗ «ΛΑΚΚΑΣΟΡΟΥΣ» (όρια κοινοτήτων Σουλίου & Μοίρα)',lat:38.167958,lng:21.829067},
      {n:4,name:'ΠΡΟΦΗΤΗΣ ΗΛΙΑΣ ΠΟΥΡΝΑΡΟΚΑΣΤΡΟ',lat:38.211121,lng:21.810584},
      {n:5,name:'ΘΕΣΗ «ΣΚΑΛΑ»',lat:38.254820,lng:21.818761},
      {n:6,name:'ΜΙΚΡΟ ΠΛΑΤΩΜΑ ΠΡΙΝ ΤΑ ΜΙΤΖΑΙΪΚΑ',lat:38.182962,lng:21.820551}
    ];

    const trailFiles = [
      '0ce996210026.json','0d5d7fe0778c.json','23fa01c5cd34.json','3cdf7fba50c8.json',
      '534490011109.json','5bd0bb7ca00f.json','632281c1c127.json','662cc45a4cda.json',
      '691ae4047433.json','7df4d8bbc519.json','b66f1a1b9a5c.json','c85c7d89f840.json','d7991d6268b8.json'
    ];
    const rawBase = 'https://raw.githubusercontent.com/gianeleftheri/panachaikotrails/main/src/data/trails/';

    const style = {
      version: 8,
      sources: {
        satellite: {
          type:'raster',
          tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize:256,maxzoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'
        },
        labels: {
          type:'raster',
          tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
          tileSize:256,maxzoom:19,attribution:'Labels © Esri'
        },
        terrainSource: {
          type:'raster-dem',
          tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          tileSize:256,maxzoom:15,encoding:'terrarium',
          attribution:'Elevation © Mapzen / AWS Terrain Tiles'
        }
      },
      layers: [
        {id:'bg',type:'background',paint:{'background-color':'#07100b'}},
        {id:'satellite',type:'raster',source:'satellite',paint:{'raster-saturation':-.08,'raster-contrast':.1}},
        {id:'labels',type:'raster',source:'labels',paint:{'raster-opacity':.78}}
      ],
      terrain:{source:'terrainSource',exaggeration:1.15}
    };

    const map = new maplibregl.Map({
      container:'map',
      style,
      center:[21.83,38.21],
      zoom:11.3,
      pitch:38,
      bearing:-8,
      attributionControl:true
    });
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');

    const list = document.getElementById('pointList');
    points.forEach(p => {
      const row = document.createElement('div');
      row.className='point';
      row.innerHTML='<span class="num">'+p.n+'</span><div><b>'+p.name+'</b><small>'+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'</small></div>';
      row.addEventListener('click',()=>map.flyTo({center:[p.lng,p.lat],zoom:15.2,pitch:55,duration:900}));
      list.appendChild(row);

      const el=document.createElement('div');
      el.className='marker';
      el.innerHTML='<span>'+p.n+'</span>';
      new maplibregl.Marker({element:el,anchor:'bottom'})
        .setLngLat([p.lng,p.lat])
        .setPopup(new maplibregl.Popup({offset:22}).setHTML('<b>'+p.n+'. '+p.name+'</b><small>'+p.lat.toFixed(6)+', '+p.lng.toFixed(6)+'</small>'))
        .addTo(map);
    });

    map.on('load', async () => {
      const bounds = new maplibregl.LngLatBounds();
      points.forEach(p=>bounds.extend([p.lng,p.lat]));
      let loaded=0, failed=0;

      for (const file of trailFiles) {
        try {
          const res = await fetch(rawBase + file, {cache:'no-store'});
          if (!res.ok) throw new Error('HTTP '+res.status);
          const data = await res.json();
          const key = data.key || file.replace('.json','');
          const trail = data.trail || {};
          const segments = (trail.segments || [])
            .map(seg => seg.map(pt => [Number(pt[0]),Number(pt[1])]).filter(pt=>Number.isFinite(pt[0])&&Number.isFinite(pt[1])))
            .filter(seg=>seg.length>1);
          if (!segments.length) continue;
          segments.flat().forEach(pt=>bounds.extend(pt));

          const sourceId='trail-'+file.replace('.json','');
          map.addSource(sourceId,{type:'geojson',data:{
            type:'Feature',
            properties:{code:key,name:trail.name||key},
            geometry:{type:'MultiLineString',coordinates:segments}
          }});
          map.addLayer({
            id:sourceId+'-shadow',type:'line',source:sourceId,
            layout:{'line-cap':'round','line-join':'round'},
            paint:{'line-color':'#07100b','line-width':7,'line-opacity':.78}
          });
          map.addLayer({
            id:sourceId+'-line',type:'line',source:sourceId,
            layout:{'line-cap':'round','line-join':'round'},
            paint:{'line-color':trail.color||'#ff6b35','line-width':4,'line-opacity':.95}
          });

          map.on('mouseenter',sourceId+'-line',()=>map.getCanvas().style.cursor='pointer');
          map.on('mouseleave',sourceId+'-line',()=>map.getCanvas().style.cursor='');
          map.on('click',sourceId+'-line',e=>{
            new maplibregl.Popup()
              .setLngLat(e.lngLat)
              .setHTML('<b>'+key+' — '+(trail.name||'Διαδρομή')+'</b><small>Μήκος: '+(trail.length_km ?? '—')+' km</small>')
              .addTo(map);
          });
          loaded++;
        } catch (err) {
          console.error(file,err);
          failed++;
        }
      }

      if (!bounds.isEmpty()) map.fitBounds(bounds,{padding:{top:70,right:70,bottom:70,left:430},maxZoom:13.2,duration:900});
      document.getElementById('status').textContent = 'Φορτώθηκαν '+loaded+' διαδρομές' + (failed ? ' · '+failed+' αποτυχίες φόρτωσης' : '') + '.';
    });
  </script>
</body>
</html>
